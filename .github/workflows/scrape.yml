name: Scrape Amazon Egypt Tez Catalog

on:
  schedule:
    # Every 4 hours (6 runs/day). 2-hourly runs queued up because a full
    # crawl can exceed 2h, and aggressive frequency triggers Amazon 503s.
    - cron: "0 */4 * * *"
  push:
    branches:
      - main
    paths:
      - 'general_keywords.json'
      - '.github/workflows/scrape.yml'
  workflow_dispatch:
    inputs:
      limit:
        description: "Limit number of categories to scrape (e.g. 2 for testing)"
        required: false
        default: ""
        type: string
      resume:
        description: "Resume incomplete scrape, skipping recently scraped categories"
        required: false
        default: false
        type: boolean
      skip_search:
        description: "Skip the keyword search crawl (coverage backfill)"
        required: false
        default: false
        type: boolean

concurrency:
  group: scrape
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  scrape:
    name: Scrape Catalog & Track Deals
    runs-on: ubuntu-latest
    timeout-minutes: 210

    env:
      AMAZON_AFFILIATE_TAG: ${{ secrets.AMAZON_AFFILIATE_TAG }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      ALLOWED_CHAT_IDS: ${{ secrets.ALLOWED_CHAT_IDS }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          # better-sqlite3 v13 declares engines.node >= 22. On Node 20 the
          # native binding segfaults (exit 139) and kills the run.
          node-version: 24
          cache: "npm"

      - name: Install NPM Dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Test Suite (data-integrity guards)
        run: npm test

      # -----------------------------------------------------------
      # Database Restore (Cache -> Artifact Fallback -> R2/S3 Optional)
      # -----------------------------------------------------------
      - name: Ensure Data Directory Exists
        run: mkdir -p data

      - name: Restore SQLite Database from Cache
        id: db-cache
        uses: actions/cache/restore@v4
        with:
          path: data/catalog.db
          key: catalog-db-${{ github.run_id }}
          restore-keys: |
            catalog-db-

      - name: Restore SQLite Database from Artifact (Fallback)
        if: steps.db-cache.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ ! -f data/catalog.db ]; then
            echo "[*] Cache missed. Attempting to download latest snapshot artifact from previous runs..."
            gh run download --name catalog-db-snapshot --dir data || true
            if [ -f data/catalog.db.gz ]; then
              echo "[+] Found catalog.db.gz from artifact. Decompressing..."
              gunzip -f data/catalog.db.gz
            fi
          fi
          if [ -f data/catalog.db ]; then
            echo "[✔] SQLite database successfully restored."
          else
            echo "[i] No previous database found. A fresh database will be initialized."
          fi

      - name: Restore SQLite Database from Cloudflare R2 / S3 (Optional)
        # NOTE: the `secrets` context is NOT allowed in step-level `if`
        # expressions; referencing it there makes the whole workflow invalid
        # (the run fails before any job is created). Guard inside the script.
        if: steps.db-cache.outputs.cache-hit != 'true'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
        run: |
          if [ -z "$R2_BUCKET_NAME" ] || [ -z "$AWS_ACCESS_KEY_ID" ]; then
            echo "[i] R2/S3 not configured, skipping cloud restore."
            exit 0
          fi
          if [ ! -f data/catalog.db ]; then
            echo "[*] Attempting restore from S3 / Cloudflare R2 bucket: $R2_BUCKET_NAME..."
            ENDPOINT_FLAG=""
            if [ -n "$R2_ENDPOINT_URL" ]; then
              ENDPOINT_FLAG="--endpoint-url $R2_ENDPOINT_URL"
            fi
            aws s3 cp "s3://$R2_BUCKET_NAME/catalog.db.gz" data/catalog.db.gz $ENDPOINT_FLAG || true
            if [ -f data/catalog.db.gz ]; then
              gunzip -f data/catalog.db.gz
              echo "[✔] Successfully restored catalog.db from R2/S3."
            fi
          fi

      # -----------------------------------------------------------
      # Scrape & Pipeline Steps
      # -----------------------------------------------------------
      # Keyword search runs FIRST because it is the reliable coverage path:
      # many category nodeIds are guessed/mis-mapped, so the full crawl below
      # can spend its budget on empty pages. Failures here must not fail the run.
      - name: Run Keyword Search Crawler (Coverage Backfill)
        id: search-crawl
        if: inputs.skip_search != true
        continue-on-error: true
        timeout-minutes: 70
        run: |
          if [ -f search_keywords.json ]; then
            echo "[*] Executing: node full_store_scraper.js --search-file search_keywords.json"
            node full_store_scraper.js --search-file search_keywords.json
          else
            echo "[i] search_keywords.json not found, skipping keyword crawl."
          fi

      - name: Run General Amazon.eg Search Crawler (All Departments)
        id: general-search-crawl
        if: inputs.skip_search != true
        continue-on-error: true
        timeout-minutes: 70
        run: |
          if [ -f general_keywords.json ]; then
            echo "[*] Executing: node full_store_scraper.js --search-file general_keywords.json"
            node full_store_scraper.js --search-file general_keywords.json
          else
            echo "[i] general_keywords.json not found, skipping general Amazon.eg crawl."
          fi

      - name: Run Full Store Scraper (Tez & Bestsellers Categories)
        id: run-scraper
        continue-on-error: true
        timeout-minutes: 60
        run: |
          ARGS=""
          if [ -n "${{ inputs.limit }}" ]; then
            ARGS="$ARGS --limit ${{ inputs.limit }}"
          fi
          if [ "${{ inputs.resume }}" = "true" ]; then
            ARGS="$ARGS --resume"
          fi
          echo "[*] Executing: node full_store_scraper.js $ARGS"
          node full_store_scraper.js $ARGS

      - name: Run Deals & Price Drops Tracker
        run: node deals_tracker.js

      - name: Send Instant Price Drop & Watchlist Alerts
        run: node scripts/send_alerts.js || true

      - name: Export Catalog Data (CSV, Excel XML, HTML)
        run: node export_data.js

      - name: Build Static Deals & Brand Site
        run: npm run build:site

      - name: Publish Scheduled Deals to Telegram Channel
        env:
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node scripts/post_channel.js --schedule || true

      - name: Run Catalog Healthcheck
        id: healthcheck
        run: node scripts/healthcheck.js

      # -----------------------------------------------------------
      # Database Checkpoint, Compression & Caching
      # -----------------------------------------------------------
      - name: Checkpoint and Compress SQLite Database
        if: always()
        run: |
          echo "[*] Checkpointing SQLite WAL..."
          node -e "try { const db = require('./src/db'); db.pragma('wal_checkpoint(TRUNCATE)'); db.close(); console.log('[✔] WAL Checkpoint finished.'); } catch(e) { console.warn('[-] Checkpoint note:', e.message); }"
          if [ -f data/catalog.db ]; then
            gzip -k -f data/catalog.db
            echo "[✔] Compressed data/catalog.db -> data/catalog.db.gz"
          fi

      - name: Save SQLite Database to Cache
        uses: actions/cache/save@v4
        # Always persist the crawl result. Previously this was gated on a
        # successful healthcheck, so one bad healthcheck threw away the entire
        # run's data and the next run restarted from a stale cache.
        if: always()
        with:
          path: data/catalog.db
          key: catalog-db-${{ github.run_id }}

      - name: Backup to Cloudflare R2 / S3 (Optional)
        if: always() && steps.healthcheck.outcome == 'success'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
        run: |
          if [ -z "$R2_BUCKET_NAME" ] || [ -z "$AWS_ACCESS_KEY_ID" ]; then
            echo "[i] R2/S3 not configured, skipping cloud backup."
            exit 0
          fi
          if [ -f data/catalog.db.gz ]; then
            ENDPOINT_FLAG=""
            if [ -n "$R2_ENDPOINT_URL" ]; then
              ENDPOINT_FLAG="--endpoint-url $R2_ENDPOINT_URL"
            fi
            echo "[*] Uploading snapshot to R2/S3..."
            aws s3 cp data/catalog.db.gz "s3://$R2_BUCKET_NAME/catalog.db.gz" $ENDPOINT_FLAG
            echo "[✔] Backup to R2/S3 completed."
          fi

      # -----------------------------------------------------------
      # Upload Artifacts (14-day retention)
      # -----------------------------------------------------------
      - name: Upload Compressed DB Snapshot Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: catalog-db-snapshot
          path: data/catalog.db.gz
          retention-days: 14

      - name: Upload Reports and Catalog Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scraper-reports
          path: |
            data/catalog.db
            deals_report.json
            products.json
            amazon_tez_products.csv
            amazon_tez_products.xls
            index.html
            dist/**
          retention-days: 14
